name: Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aioruckus
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so hatch-vcs sees tags; a shallow checkout can't
          # resolve the version and uploads the same fallback version every run.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Publish to TestPyPI
        # --check-url makes this idempotent: TestPyPI errors on a file it
        # already holds, so a re-run or re-tagged push would otherwise fail.
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/

  publish-pypi:
    # When a new version is tagged
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aioruckus
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so hatch-vcs sees tags; a shallow checkout can't
          # resolve the version and uploads the same fallback version every run.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # PyPI accepts a re-upload of identical files, so this needs no
        # duplicate handling; --check-url is harmless but adds a round trip.
        run: uv publish
