[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "aioruckus"
dynamic = ["version"]
description = "Python API to interact with Ruckus Unleashed and ZoneDirector devices"
readme = "README.md"
requires-python = ">=3.9"
license = "0BSD"
license-files = ["LICENSE"]
authors = [
    { name = "Tony Rielly", email = "aioruckus@ms264556.net" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
dependencies = [
    "aiohttp>=3.9.5",
    "cryptography>=41.0.7",
    "xmltodict>=0.13.0",
    "typing_extensions>=4.5.0; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/ms264556/aioruckus"
Issues = "https://github.com/ms264556/aioruckus/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # pytest-asyncio dropped Python 3.9 support in 1.3.0, so 3.9 is pinned to
    # the 1.2.x line (which still supports asyncio_mode = "auto").
    "pytest-asyncio>=1.2.0,<1.3; python_version < '3.10'",
    "pytest-asyncio>=1.4.0; python_version >= '3.10'",
    "pylint-pytest>=1.1.7",
    # pylint 4.x dropped Python 3.9; 3.9 uses the 3.3.x line.
    "pylint>=3.3.0,<4; python_version < '3.10'",
    "pylint>=4.0.6; python_version >= '3.10'",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "live: tests that require access to live Ruckus hardware; deselected by default (run explicitly with `pytest -m live`)",
]
# Live-device tests are deselected by default so a plain test run passes
# completely without hardware access (distro builds / CI). Run them with
# `pytest -m live`; unconfigured providers are still skipped via env vars.
addopts = "-m 'not live'"
# Run async tests without needing an explicit @pytest.mark.asyncio on every
# one; in strict mode a test missing its marker silently never runs.
asyncio_mode = "auto"
# Treat un-awaited coroutines and unraisable exceptions as errors: these
# indicate a test (or the mock) is not actually exercising what it claims.
filterwarnings = [
    "error",
    # ResourceWarning is deliberately NOT ignored: an unclosed ClientSession
    # means a test (or the library) leaked a connection.
    # aiohttp/deprecation noise from third-party internals is not ours to fix
    "ignore::DeprecationWarning:aiohttp.*",
]

[tool.pylint.main]
load-plugins = ["pylint_pytest"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Local versions (+g<commit>) must not be used: neither TestPyPI nor PyPI
# accepts them, both answering 400 "The use of local versions ... is not
# allowed". That leaves only the core version, which for an untagged commit is
# the commit distance to the last tag - so a build must be skipped when that
# version already exists, which --check-url does. See the Publish workflow.
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "aioruckus/_version.py"
